name: 04 - Working with Third-Party Custom Actions

on: 
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-app/react-app
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: node setup
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.x'
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm run test 
              
