name: 12 - Working with Outputs

on:
  workflow_dispatch:
    inputs:
      build-status:
        type: choice
        default: success
        options:
          - succcess
          - failure

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{steps.building.outputs.status}}
    steps:
      - name: Print GITHUB_OUTPUT path
        run: echo "$GITHUB_OUTPUT"
      - name: building
        id: building
        run: echo "status=${{inputs.build-status}}">> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.build-status == 'success' }}
    steps:
      - name: deploy
        run: echo "deploying"
