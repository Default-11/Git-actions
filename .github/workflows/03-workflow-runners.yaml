name: 03-workflow-runners

on:
  - push
  - workflow_dispatch

jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
      steps:
        - name: Show OS
          run: echo "This job is running on an ${{runner.os}}"
  windows-echo:
    runs-on: windwos-latest
      steps:
        - name: Show OS
          run: echo "This job is running on an ${{runner.os}}"   
  
